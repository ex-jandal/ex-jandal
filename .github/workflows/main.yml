name: generate animation

on:
  # run automatically every 24 hours
  schedule:
    - cron: "0 */24 * * *" 
  
  # allows to manually run the job at any time
  workflow_dispatch:
  
  # run on every push on the master branch
  push:
    branches:
    - main
    
  

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      # generates a snake game from a github user (<github_user_name>) contributions graph, output a svg animation at <svg_out_path>
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#8ec07c&color_dots=#1d2021,#3c3836,#504945,#689d6a,#8ec07c
            dist/github-snake-dark.svg?color_snake=#8ec07c&color_dots=#1d2021,#3c3836,#504945,#689d6a,#8ec07c

      - name: generate codeberg-snake.svg
        uses: platane/snk/forgejo@v3
        with:
          forgejo_instance: codeberg.org
          forgejo_user_name: ex-jandal
          outputs: |
            dist/codeberg-snake.svg?color_snake=#fe8019&color_dots=#1d2021,#3c3836,#504945,#d79921,#fe8019
            dist/codeberg-snake-dark.svg?color_snake=#fe8019&color_dots=#1d2021,#3c3836,#504945,#d79921,#fe8019

      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
